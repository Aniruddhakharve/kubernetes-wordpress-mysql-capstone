apiVersion: v1
kind: Service
metadata:
  name: wordpress-service
  namespace: capstone
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - port: 80        #1. Cluster Service Port (kube-proxy) , The port exposed inside the cluster 
      targetPort: 80  # 2. Container/Pod Port , The port your bankapp container is listening on
      nodePort: 30080 # 3. Node Port , The port exposed on the node
      protocol: TCP