NFS_CORE_PARAM {
    Protocols = 4;
    allow_set_io_flusher_fail = true;
    Enable_UDP = false;
    Enable_RQUOTA = false;
}
EXPORT {
    Export_Id = 1;
    Path = /exports;
    Pseudo = /wordpress-uploads;
    Access_Type = RW;
    Squash = Root_Squash;
    SecType = sys;
    
    CLIENT {
        Clients = 172.19.0.0/16;
    }

    FSAL {
        Name = VFS;
    }
}
LOG {
    COMPONENTS {
        FSAL = FULL_DEBUG;
        EXPORT = FULL_DEBUG;
        NFS4 = FULL_DEBUG;
    }

    Default_Log_Level = INFO;

    Facility {
        name = FILE;
        destination = "/var/log/ganesha/ganesha.log";
        enable = active;
    }
}